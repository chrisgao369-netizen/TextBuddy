name: Build Windows Exe
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Exe using jpackage
      run: |
        jpackage --input "./out/artifacts/TextEditor_jar" --dest "./output" --name "TextBuddy" --main-jar TextEditor.jar --type exe --main-class TextEditor

    - name: Upload Exe File
      uses: actions/upload-artifact@v4
      with:
        name: TextBuddy-Windows-Exe
        path: output/
